services:
  oshirigame:
    build: .
    image: oshirigame
    container_name: oshirigame
    ports:
      - "8080:8080"
    environment:
      # Daily-mode leaderboard lives in an embedded sqlite database on this volume
      - DB_PATH=/data/oshirigame.db
      # Downloaded dictionaries are cached here so restarts work offline
      - WORDLIST_DIR=/data/wordlists
    volumes:
      - oshirigame-data:/data
    restart: unless-stopped

volumes:
  oshirigame-data:
